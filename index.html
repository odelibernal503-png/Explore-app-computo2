<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01-Home - Explorer App</title>
  </head>
  <body class="bg-[#f6e8ea] text-[#111827] font-sans m-0 min-h-screen flex flex-col">

    <!-- Encabezado superior semántico -->
    <header class="bg-white border-b border-gray-200 py-4 px-4 sm:px-6 md:px-12 shadow-sm w-full">
      <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between">
        <div class="flex items-center justify-between w-full md:w-auto">
          <a href="#" class="text-base font-bold text-gray-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900 rounded-sm transition-colors">Where in the world?</a>

          <!-- Botón de menú hamburguesa accesible para móviles -->
          <button
            id="menu-toggle"
            type="button"
            class="flex size-10 items-center justify-center rounded-md md:hidden transition-all duration-200 hover:bg-gray-100 active:scale-95 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900 cursor-pointer"
            aria-controls="main-menu"
            aria-expanded="false"
            aria-label="Abrir menú de navegación"
          >
            <svg id="menu-open-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="size-6 text-gray-700">
              <path stroke-linecap="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
            <svg id="menu-close-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="hidden size-6 text-gray-700">
              <path stroke-linecap="round" stroke-width="2" d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>

        <!-- Navegación principal -->
        <nav id="main-menu" class="hidden md:block mt-4 md:mt-0 transition-all duration-300" aria-label="Navegación principal">
          <ul class="flex flex-col md:flex-row items-start md:items-center gap-3 md:gap-8 text-xs font-medium text-gray-800">
            <li>
              <a href="#inicio" class="block py-2 md:py-1 pb-1 hover:border-b-2 hover:border-gray-900 transition-all duration-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900 rounded-sm" aria-current="page">Inicio</a>
            </li>
            <li>
              <a href="#paises" class="block py-2 md:py-1 pb-1 hover:border-b-2 hover:border-gray-500 transition-all duration-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900 rounded-sm">Explorar países</a>
            </li>
            <li>
              <a href="#acerca-de" class="block py-2 md:py-1 pb-1 hover:border-b-2 hover:border-gray-500 transition-all duration-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900 rounded-sm">Acerca de</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Contenido principal -->
    <main id="inicio" class="max-w-7xl mx-auto px-4 sm:px-6 md:px-12 py-10 w-full flex-grow">

      <!-- Sección de búsqueda y filtros -->
      <section class="mb-8">
        <h2 class="text-2xl font-extrabold text-[#111827] mb-1">Explora países del mundo</h2>
        <p class="text-xs text-[#525252] mb-5">Busca un país o filtra por región para consultar su información detallada</p>
        
        <div class="flex flex-col md:flex-row gap-6">
          <!-- Input de búsqueda -->
          <div class="bg-white px-4 py-3 rounded-md shadow-sm w-full md:w-[540px] flex items-center gap-3 border border-gray-300 focus-within:ring-2 focus-within:ring-[#f9a03f] focus-within:outline-none transition-all duration-200">
            <img src="/src/assets/busqueda.svg" alt="" class="size-4 text-gray-400" aria-hidden="true" />
            <label for="country-search" class="sr-only">Escriba el nombre del país</label>
            <input id="country-search" type="text" placeholder="Escriba el nombre del país..." class="w-full bg-transparent focus:outline-none text-xs text-gray-700 placeholder-gray-400">
          </div>
          
          <!-- Selector de región -->
          <div class="relative w-full md:w-[280px]">
            <label for="region-filter" class="sr-only">Busque por región</label>
            <select id="region-filter" class="bg-white px-4 py-3 pr-10 rounded-md shadow-sm w-full appearance-none border border-gray-300 text-xs text-gray-500 focus:outline-none focus:ring-2 focus:ring-[#f9a03f] cursor-pointer transition-all duration-200">
              <option value="">Busque por región</option>
              <option value="asia">Asia</option>
              <option value="europe">Europa</option>
              <option value="americas">América</option>
              <option value="africa">África</option>
            </select>
            <img src="/src/assets/selector.svg" alt="" class="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 size-3.5 text-gray-500" aria-hidden="true" />
          </div>
        </div>
      </section>

      <!-- Grid responsive de tarjetas (Dinámico) -->
      <section id="paises" class="w-full">
        <h3 class="text-lg font-bold text-[#111827] mb-5">Países recomendados</h3>
        
        <section 
            id="countries-container"
            class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 lg:gap-8 xl:grid-cols-4"
            aria-label="Listado de países"
        >
          <!-- Las tarjetas se cargarán dinámicamente aquí mediante TypeScript -->
        </section>
      </section>

    </main>

    <!-- Pie de página semántico -->
    <footer id="acerca-de" class="bg-white border-t border-gray-200 py-4 px-4 sm:px-6 md:px-12 text-[10px] text-gray-600 mt-12 w-full">
      <div class="max-w-7xl mx-auto w-full flex flex-col sm:flex-row justify-between items-center gap-3">
        <div>
          <p class="font-semibold text-gray-900">Explorer App</p>
          <p>© 2026 Explorer App. Data provided by Rest Countries</p>
        </div>
        <div class="space-x-3">
          <a href="#" class="hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900 rounded-sm">Documentation</a>
          <span>·</span>
          <a href="#" class="hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900 rounded-sm">Source Code</a>
          <span>·</span>
          <a href="#" class="hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900 rounded-sm">Privacy</a>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
